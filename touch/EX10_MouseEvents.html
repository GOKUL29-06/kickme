<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mouse Events</title>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:30px 18px;display:grid;place-items:center;background:#f3f5fb;color:#18233f;font-family:Inter,Segoe UI,Arial,sans-serif}.card{width:min(100%,700px);text-align:center;background:white;border:1px solid #e4e9f4;border-radius:24px;padding:clamp(25px,5vw,44px);box-shadow:0 24px 65px #283b7215}.tag{font-size:.75rem;letter-spacing:.16em;color:#6558e8;font-weight:800}h1{margin:12px 0 8px}.desc{color:#738098;line-height:1.7}.hover-box{width:210px;height:190px;margin:28px auto 22px;display:grid;place-items:center;border-radius:20px;background:linear-gradient(135deg,#6558e8,#8a7ff5);color:white;font-size:1.1rem;font-weight:700;box-shadow:0 15px 30px #6558e833;transition:background .2s,transform .2s;cursor:pointer}.hover-box:hover{transform:translateY(-2px)}button{padding:13px 20px;border:0;border-radius:11px;background:#18233f;color:white;font-size:1rem;font-weight:700;cursor:pointer}button:hover{background:#34436b}.message{min-height:28px;margin-top:20px;color:#6558e8;font-weight:700}
</style></head><body><main class="card"><div class="tag">JAVASCRIPT & JQUERY</div><h1>Mouse Events Playground</h1><p class="desc">Move your pointer over the card, move it away, or click the button to trigger an event.</p>
<div id="hover-box" class="hover-box">Hover Over Me!</div><button id="click-button" type="button">Click Me!</button><div id="message" class="message" aria-live="polite"></div></main>
<script>$(document).ready(function(){const hoverBox=$('#hover-box');const messageDiv=$('#message');hoverBox.on('mouseover',function(){$(this).text('Mouse Over!').css('background','linear-gradient(135deg,#0e9f6e,#34d399)');messageDiv.text('Mouseover event detected.');});hoverBox.on('mouseout',function(){$(this).text('Hover Over Me!').css('background','linear-gradient(135deg,#6558e8,#8a7ff5)');messageDiv.text('Mouseout event detected.');});$('#click-button').on('click',function(){messageDiv.text('Button clicked successfully!');});});</script>
</body></html>
