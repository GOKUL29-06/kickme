<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AngularJS Form Validation</title>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:30px 16px;display:grid;place-items:center;background:linear-gradient(135deg,#eef2ff,#f8fbff);font-family:Inter,Segoe UI,Arial,sans-serif;color:#1b2540}.form-card{width:100%;max-width:650px;background:white;border:1px solid #e3e8f4;border-radius:24px;padding:clamp(22px,5vw,40px);box-shadow:0 24px 70px #283b7217}.tag{color:#6558e8;font-size:.75rem;font-weight:800;letter-spacing:.17em}h1{margin:10px 0 8px;font-size:2rem}.desc{color:#748098;margin:0 0 26px;line-height:1.6}.field{margin:17px 0}.field label{display:block;font-size:.9rem;font-weight:700;margin-bottom:8px}.field input,.field select{width:100%;padding:13px 14px;border:1px solid #dce2ef;border-radius:11px;background:#fbfcff;font:inherit;outline:none}.field input:focus,.field select:focus{border-color:#6558e8;box-shadow:0 0 0 3px #6558e81c}.error{display:block;color:#c43d5c;font-size:.82rem;margin-top:7px}.submit{width:100%;border:0;border-radius:11px;padding:14px;background:#6558e8;color:white;font-size:1rem;font-weight:700;cursor:pointer;margin-top:8px}.submit:hover{background:#4e42cf}
</style></head><body ng-app="myApp" ng-controller="FormController">
<main class="form-card"><div class="tag">FORM VALIDATION</div><h1>Create your profile</h1><p class="desc">Enter your details below. Required fields and invalid entries will be highlighted.</p>
<form name="myForm" ng-submit="submitForm()" novalidate>
<div class="field"><label for="username">Username</label><input id="username" type="text" name="username" ng-model="user.username" required placeholder="Enter username"><span class="error" ng-show="myForm.username.$touched && myForm.username.$error.required">Username is required.</span></div>
<div class="field"><label for="email">Email address</label><input id="email" type="email" name="email" ng-model="user.email" required placeholder="you@example.com"><span class="error" ng-show="myForm.email.$touched && myForm.email.$error.required">Email is required.</span><span class="error" ng-show="myForm.email.$touched && myForm.email.$error.email">Enter a valid email address.</span></div>
<div class="field"><label for="password">Password</label><input id="password" type="password" name="password" ng-model="user.password" ng-minlength="6" required placeholder="At least 6 characters"><span class="error" ng-show="myForm.password.$touched && myForm.password.$error.required">Password is required.</span><span class="error" ng-show="myForm.password.$touched && myForm.password.$error.minlength">Password must be at least 6 characters.</span></div>
<div class="field"><label for="age">Age</label><input id="age" type="number" name="age" ng-model="user.age" min="0" required placeholder="Enter age"><span class="error" ng-show="myForm.age.$touched && myForm.age.$invalid">Enter a valid age.</span></div>
<div class="field"><label for="gender">Gender</label><select id="gender" name="gender" ng-model="user.gender" required><option value="">Select gender</option><option value="male">Male</option><option value="female">Female</option><option value="other">Other</option></select><span class="error" ng-show="myForm.gender.$touched && myForm.gender.$error.required">Please select a gender.</span></div>
<button class="submit" type="submit">Submit details →</button>
</form></main>
<script>angular.module('myApp',[]).controller('FormController',function($scope){$scope.user={};$scope.submitForm=function(){if($scope.myForm.$valid){alert('Form submitted successfully!');$scope.user={};$scope.myForm.$setPristine();$scope.myForm.$setUntouched();}else{alert('Please correct the errors in the form.');}};});</script>
</body></html>
