<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>jQuery Hide and Show</title>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#eef2ff,#f7fbff);font-family:Inter,Segoe UI,Arial,sans-serif;color:#18233f}.card{width:min(100%,600px);padding:clamp(25px,6vw,48px);background:white;border:1px solid #e4e9f4;border-radius:24px;text-align:center;box-shadow:0 24px 65px #283b7218}.tag{font-size:.75rem;letter-spacing:.16em;color:#6558e8;font-weight:800}.card h1{font-size:2rem;margin:12px 0}.card p{color:#6d7890;line-height:1.8;margin:25px 0}.button{padding:13px 20px;border:0;border-radius:11px;background:#6558e8;color:white;font-size:1rem;font-weight:700;cursor:pointer}.button:hover{background:#4e42cf}.note{font-size:.8rem!important;margin-bottom:0!important}
</style></head><body><main class="card"><div class="tag">JQUERY INTERACTION</div><h1>Hide & Show Paragraph</h1><p id="paragraph">This paragraph can be hidden or shown using jQuery. Click the button below to toggle its visibility.</p><button class="button" id="toggle-button">Hide Paragraph</button><p class="note">A simple demonstration of the jQuery click event.</p></main>
<script>$(document).ready(function(){$('#toggle-button').click(function(){var $paragraph=$('#paragraph');if($paragraph.is(':visible')){$paragraph.hide();$(this).text('Show Paragraph');}else{$paragraph.show();$(this).text('Hide Paragraph');}});});</script>
</body></html>
